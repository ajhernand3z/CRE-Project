# One-click deploy config for https://render.com (free tier).
# Render reads this file when you create a "Blueprint" from the repo.
services:
  - type: web
    name: cre-comp-analysis
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash scripts/deploy_start.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: ANTHROPIC_API_KEY
        sync: false   # set the value in the Render dashboard, never in git
